<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Suika Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    body {
      background: #f7f4ea;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
    }
    #score {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #4a3b32;
    }
    canvas {
      border: 4px solid #4a3b32;
      background: #fffef0;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="score">Score: 0</div>

<script>
const { Engine, Render, Runner, Bodies, Composite, Events, World } = Matter;

// Game Configuration
const WIDTH = 450;
const HEIGHT = 600;
let score = 0;
let canDrop = true;

// Fruit Tiers (Radius, Color, Points)
const FRUITS = [
  { radius: 15, color: '#e74c3c', score: 2 },   // Cherry
  { radius: 25, color: '#e67e22', score: 4 },   // Strawberry
  { radius: 35, color: '#9b59b6', score: 8 },   // Grape
  { radius: 45, color: '#f1c40f', score: 12 },  // Dekopon
  { radius: 55, color: '#e67e22', score: 16 },  // Orange
  { radius: 70, color: '#2ecc71', score: 20 },  // Apple
  { radius: 85, color: '#1abc9c', score: 26 },  // Pear
  { radius: 100, color: '#f39c12', score: 32 }, // Peach
  { radius: 115, color: '#d35400', score: 40 }, // Pineapple
  { radius: 130, color: '#27ae60', score: 50 }  // Watermelon
];

let currentFruitIndex = getRandomFruitIndex();

// Engine Setup
const engine = Engine.create();
const render = Render.create({
  element: document.body,
  engine: engine,
  options: {
    width: WIDTH,
    height: HEIGHT,
    wireframes: false,
    background: '#fffef0'
  }
});

// Walls
const ground = Bodies.rectangle(WIDTH / 2, HEIGHT + 30, WIDTH, 80, { isStatic: true });
const leftWall = Bodies.rectangle(-30, HEIGHT / 2, 80, HEIGHT, { isStatic: true });
const rightWall = Bodies.rectangle(WIDTH + 30, HEIGHT / 2, 80, HEIGHT, { isStatic: true });

World.add(engine.world, [ground, leftWall, rightWall]);

Render.run(render);
Runner.run(Runner.create(), engine);

function getRandomFruitIndex() {
  // Only spawn smaller fruits (tiers 0 to 4)
  return Math.floor(Math.random() * 5);
}

function createFruit(x, y, index, isStatic = false) {
  const fruit = FRUITS[index];
  const body = Bodies.circle(x, y, fruit.radius, {
    isStatic: isStatic,
    restitution: 0.3,
    friction: 0.1,
    render: { fillStyle: fruit.color }
  });
  body.fruitIndex = index;
  return body;
}

// Drop controls
window.addEventListener('click', (e) => {
  if (!canDrop) return;

  const rect = render.canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  
  // Keep fruit inside container boundaries
  const radius = FRUITS[currentFruitIndex].radius;
  x = Math.max(radius, Math.min(WIDTH - radius, x));

  const fruit = createFruit(x, 50, currentFruitIndex);
  World.add(engine.world, fruit);

  canDrop = false;
  currentFruitIndex = getRandomFruitIndex();

  setTimeout(() => { canDrop = true; }, 600);
});

// Collision Handling (Merging)
Events.on(engine, 'collisionStart', (event) => {
  event.pairs.forEach((collision) => {
    const { bodyA, bodyB } = collision;

    if (
      bodyA.fruitIndex !== undefined &&
      bodyB.fruitIndex !== undefined &&
      bodyA.fruitIndex === bodyB.fruitIndex
    ) {
      const currentIndex = bodyA.fruitIndex;

      // Do not merge top-tier fruit
      if (currentIndex >= FRUITS.length - 1) return;

      World.remove(engine.world, [bodyA, bodyB]);

      // Midpoint position for new merged fruit
      const newX = (bodyA.position.x + bodyB.position.x) / 2;
      const newY = (bodyA.position.y + bodyB.position.y) / 2;

      const newFruit = createFruit(newX, newY, currentIndex + 1);
      World.add(engine.world, newFruit);

      score += FRUITS[currentIndex + 1].score;
      document.getElementById('score').innerText = `Score: ${score}`;
    }
  });
});
</script>
</body>
</html>
